name: Windows installer validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VITE_API_URL: https://api.bestwayec.uz/v1
      VITE_WEB_URL: https://bestwayec.uz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      - run: npm ci --include=dev
      - run: npm test
      - run: node --test tools/release-platforms.test.mjs tools/validate-release.test.mjs tools/windows-validation.test.mjs
      - run: npm run build
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo clippy --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      # Use the existing manual-installer overlay only for this CI artifact.
      # Production updater signing stays enabled in the base configuration.
      - name: Build x64 NSIS installer without publishing a release
        env:
          VITE_API_URL: https://bestway-native.test/v1
          VITE_WEB_URL: https://bestway-native.test
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.manual-installer.conf.json
      - name: Require a nonempty installer and record its checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1 -or $installers[0].Length -eq 0) { throw 'Expected one nonempty NSIS installer' }
          Get-FileHash $installers[0].FullName -Algorithm SHA256 | Format-List
      - name: Install and launch the Windows app on a clean runner
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'Bestway-Native-Acceptance'
          if (Test-Path $installDir) { throw 'Expected an empty install destination' }
          $install = Start-Process $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $executable = Join-Path $installDir 'bestway-app.exe'
          if (!(Test-Path $executable)) { throw 'Executable missing after installation' }
          $startup = [Diagnostics.Stopwatch]::StartNew()
          $app = Start-Process $executable -PassThru
          try {
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
              if ($app.HasExited) { throw "App exited during startup with $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0) { break }
            } while ($startup.Elapsed.TotalSeconds -lt 45)
            if ($app.MainWindowHandle -eq 0 -or $app.MainWindowTitle -ne 'Bestway Exam') {
              throw 'The Bestway Exam window did not appear'
            }
            $startup.Stop()

            # Poll for WebView2 child processes (direct, indirect descendants, or attributed by command line)
            $wvTimer = [Diagnostics.Stopwatch]::StartNew()
            $webviews = @()
            do {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) { throw "App exited shortly after window creation with $($app.ExitCode)" }

              $allProcs = @(Get-CimInstance Win32_Process)
              $descendantPids = [System.Collections.Generic.HashSet[int]]::new()
              $queue = [System.Collections.Generic.Queue[int]]::new()
              $queue.Enqueue($app.Id)
              while ($queue.Count -gt 0) {
                $curr = $queue.Dequeue()
                foreach ($p in $allProcs) {
                  if ($p.ParentProcessId -eq $curr -and !$descendantPids.Contains($p.ProcessId)) {
                    [void]$descendantPids.Add($p.ProcessId)
                    $queue.Enqueue($p.ProcessId)
                  }
                }
              }

              $webviews = @($allProcs | Where-Object {
                $_.Name -eq 'msedgewebview2.exe' -and (
                  $_.ParentProcessId -eq $app.Id -or
                  $descendantPids.Contains($_.ProcessId) -or
                  ($_.CommandLine -and ($_.CommandLine -like "*bestway-app.exe*" -or $_.CommandLine -like "*uz.bestwayec.app*"))
                )
              })
              if ($webviews.Count -gt 0) { break }
            } while ($wvTimer.Elapsed.TotalSeconds -lt 30)

            if (!$webviews.Count) {
              Write-Warning "App PID: $($app.Id); HasExited: $($app.HasExited); WorkingSet: $($app.WorkingSet64)"
              $allWv = @(Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'")
              Write-Warning "Running msedgewebview2 processes: $($allWv.Count)"
              foreach ($w in $allWv) {
                Write-Warning "PID=$($w.ProcessId), Parent=$($w.ParentProcessId), CmdLine=$($w.CommandLine)"
              }
              throw 'WebView2 child process did not start within 30 seconds'
            }

            # Verify real application working set and startup evidence
            $appWorkingSetMb = [Math]::Round($app.WorkingSet64 / 1MB, 1)
            if ($app.WorkingSet64 -lt 10MB) {
              throw "App working set memory too low ($appWorkingSetMb MiB), indicating stub or incomplete load"
            }

            $metrics = "Commit $env:GITHUB_SHA; first window $($startup.ElapsedMilliseconds) ms; app working set $appWorkingSetMb MiB; WebView2 children $($webviews.Count) (ready in $($wvTimer.ElapsedMilliseconds) ms)"
            Write-Host $metrics
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $metrics

            # Inspect startup log if available
            $logDirs = @(
              Join-Path $env:APPDATA 'uz.bestwayec.app\logs',
              Join-Path $env:LOCALAPPDATA 'uz.bestwayec.app\logs'
            )
            foreach ($dir in $logDirs) {
              if (Test-Path $dir) {
                $logFiles = Get-ChildItem -Path $dir -Filter "app-*.log"
                foreach ($lf in $logFiles) {
                  Write-Host "Log content from $($lf.Name):"
                  Get-Content $lf.FullName | Write-Host
                }
              }
            }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bestway-windows-x64-validation
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
