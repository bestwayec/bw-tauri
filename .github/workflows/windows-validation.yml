name: Windows installer validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VITE_API_URL: https://api.bestwayec.uz/v1
      VITE_WEB_URL: https://bestwayec.uz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      - run: npm ci --include=dev
      - run: npm test
      - run: node --test tools/release-platforms.test.mjs tools/validate-release.test.mjs
      - run: npm run build
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo clippy --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      # Use the existing manual-installer overlay only for this CI artifact.
      # Production updater signing stays enabled in the base configuration.
      - name: Build x64 NSIS installer without publishing a release
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.manual-installer.conf.json
      - name: Require a nonempty installer and record its checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1 -or $installers[0].Length -eq 0) { throw 'Expected one nonempty NSIS installer' }
          Get-FileHash $installers[0].FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bestway-windows-x64-validation
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
