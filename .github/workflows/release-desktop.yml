# Release the Tauri desktop app as `bestway-app vX.Y.Z`.
#
# How to release:
#   1. Bump version in package.json,
#      src-tauri/tauri.conf.json and
#      src-tauri/Cargo.toml (keep all three in sync).
#   2. Commit, then tag:  git tag bestway-app-v0.3.0
#   3. Push the tag:      git push origin bestway-app-v0.3.0
# CI builds Windows x64 (.exe via nsis), macOS Intel/Apple Silicon (.dmg) and
# Linux (.AppImage/.deb) and attaches them to the GitHub Release
# named `bestway-app vX.Y.Z`.
name: Release Desktop (bestway-app)

on:
  push:
    tags:
      - "bestway-app-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing bestway-app tag with successful CI
        required: true
        type: string
      platform:
        description: Build missing installers, or one missing native platform
        required: true
        default: missing
        type: choice
        options:
          - missing
          - windows-x64
          - linux-x64
          - macos-intel
          - macos-apple-silicon

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read # default-deny; jobs below request exactly what they need

jobs:
  prepare:
    permissions:
      # Reading unpublished drafts requires push access; this job only reads.
      contents: write
      actions: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      release_id: ${{ steps.release.outputs.release_id }}
      matrix: ${{ steps.release.outputs.matrix }}
      has_builds: ${{ steps.release.outputs.has_builds }}
    steps:
      - name: Checkout release orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Release planning tests
        run: node --test tools/release-platforms.test.mjs
      - name: Resolve existing tag and verify CI
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_PLATFORM: ${{ inputs.platform || 'missing' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { findReleaseByTag, releasePlan, RELEASE_PLATFORMS } from './tools/release-platforms.mjs';
          const tag = process.env.RELEASE_TAG;
          const number = '(0|[1-9][0-9]*)';
          const pattern = new RegExp(`^(?:bestway-app-)?v${number}\\.${number}\\.${number}(-(rc|beta|alpha)\\.${number})?$`);
          if (!pattern.test(tag) || /[\r\n]/.test(tag)) throw new Error('Expected an existing (bestway-app-)vX.Y.Z tag, optionally with -rc.N, -beta.N or -alpha.N');
          const base = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          async function api(path, optional = false) {
            const response = await fetch(`${base}${path}`, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (optional && response.status === 404) return null;
            if (!response.ok) throw new Error(`GitHub ${path} returned HTTP ${response.status}`);
            return response.json();
          }
          let object = (await api(`/git/ref/tags/${encodeURIComponent(tag)}`)).object;
          for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
            object = (await api(`/git/tags/${object.sha}`)).object;
          }
          if (object.type !== 'commit' || !/^[0-9a-f]{40}$/.test(object.sha)) {
            throw new Error('The release tag must resolve to a commit');
          }
          const query = new URLSearchParams({ head_sha: object.sha, status: 'completed', per_page: '100' });
          const { workflow_runs: runs } = await api(`/actions/workflows/ci.yml/runs?${query}`);
          if (!runs.some(run => run.head_sha === object.sha && run.status === 'completed' && run.conclusion === 'success')) {
            throw new Error(`CI has not passed for tagged commit ${object.sha}`);
          }
          const release = await findReleaseByTag(api, tag);
          const plan = releasePlan(tag, release?.assets || [], process.env.RELEASE_PLATFORM);
          const matrix = { include: plan.hasBuilds ? plan.include : [RELEASE_PLATFORMS[0]] };
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\ncommit=${object.sha}\nrelease_id=${release?.id || ''}\nmatrix=${JSON.stringify(matrix)}\nhas_builds=${plan.hasBuilds}\n`);
          console.log(`Verified ${tag} at ${object.sha} with successful CI`);
          console.log(`Missing installers: ${plan.include.map(row => row.platform).join(', ') || 'none; existing release is complete'}`);
          NODE

  build:
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    name: Build ${{ matrix.platform }}
    permissions:
      contents: write # tauri-action creates the Release and uploads bundles
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false # release upload uses GITHUB_TOKEN via env, not git credentials

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Pinned: lockfile is generated with this Node/npm pair (24.13.0/npm 11.6.2).
          # Floating `24` pulls newer npm (v12) which resolves optional deps
          # (@emnapi/*) differently and breaks `npm ci` with "Missing from lock file".
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libssl-dev libxdo-dev

      - name: Install frontend deps
        run: npm ci

      - name: Validate release configuration
        id: release-config
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          # Keep manual downloads available without an updater signing key.
          # Set the repository variable to signed_updater for signed updates.
          DESKTOP_RELEASE_MODE: ${{ vars.DESKTOP_RELEASE_MODE || 'manual_installer' }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: GITHUB_REF_NAME="$RELEASE_TAG" node tools/validate-release.mjs

      - name: Release configuration tests
        run: node tools/validate-release.test.mjs

      - name: Frontend tests
        run: npm test

      - name: Build frontend for native tests
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
        run: npm run build

      - name: Native tests
        working-directory: src-tauri
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build + Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: .
          args: ${{ steps.release-config.outputs.args }} --target ${{ matrix.target }}
          includeUpdaterJson: ${{ steps.release-config.outputs.includeUpdaterJson }}
          tagName: ${{ needs.prepare.outputs.tag }}
          # Existing release ID uploads additively without changing Latest/draft flags.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseCommitish: ${{ needs.prepare.outputs.commit }}
          releaseName: "bestway-app ${{ needs.prepare.outputs.tag }}"
          releaseBody: "Student lockdown exam client (Tauri v2). Pick your OS installer below."
          # New releases stay private until every native platform has passed.
          releaseDraft: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-rc.') || contains(needs.prepare.outputs.tag, '-beta.') || contains(needs.prepare.outputs.tag, '-alpha.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Backend the RELEASE build talks to (baked in by Vite at build time).
          # Required: set the `VITE_API_URL` repo variable (e.g. https://api.bestway.uz/v1).
          # Validated above: production releases must use an explicit HTTPS backend.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
          # Updater signing: signs `latest.json` + bundles via minisign.
          # Private key must be stored as a CI secret (never committed).
          # Generate: `npm run tauri signer generate -w ~/.tauri/bestway.key`
          # then `gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/bestway.key`
          # Public key lives in `src-tauri/tauri.conf.json` (`plugins.updater.pubkey`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify macOS bundle microphone permission and native architecture
        if: runner.os == 'macOS'
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,os,plistlib,subprocess
          from pathlib import Path
          target=os.environ['NATIVE_TARGET']
          apps=glob.glob(f'src-tauri/target/{target}/release/bundle/macos/*.app')
          if len(apps)!=1:raise RuntimeError('Expected one native macOS app bundle')
          app=Path(apps[0])
          info=plistlib.loads((app/'Contents/Info.plist').read_bytes())
          expected=json.loads(Path('package.json').read_text())['version']
          if info.get('CFBundleShortVersionString')!=expected:raise RuntimeError('macOS bundle version mismatch')
          if not info.get('NSMicrophoneUsageDescription','').strip():raise RuntimeError('macOS microphone usage description is missing')
          architecture=subprocess.check_output(['lipo','-archs',str(app/'Contents/MacOS'/info['CFBundleExecutable'])],text=True).strip()
          if architecture!=('arm64' if target.startswith('aarch64') else 'x86_64'):raise RuntimeError('macOS binary architecture mismatch')
          signed=plistlib.loads(subprocess.run(['codesign','-d','--entitlements',':-',str(app)],check=True,capture_output=True).stdout)
          if signed.get('com.apple.security.device.audio-input') is not True:raise RuntimeError('macOS microphone audio-input entitlement is missing')
          subprocess.run(['codesign','--verify','--strict',str(app)],check=True)
          print(f'Verified {expected} {architecture}: microphone usage description and audio-input entitlement; ad-hoc signature, no notarization claim')
          PY

  publish:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.has_builds == 'false')) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify all installers before publishing a stable Latest release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { findReleaseByTag, releasePlan } from './tools/release-platforms.mjs';
          const tag=process.env.RELEASE_TAG;
          const base=`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          async function api(path,body) {
            const response=await fetch(base+path,{method:body?'PATCH':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},...(body?{body:JSON.stringify(body)}:{})});
            if(!response.ok)throw new Error(`GitHub ${path} returned HTTP ${response.status}`);
            return response.json();
          }
          const release=process.env.RELEASE_ID ? await api(`/releases/${process.env.RELEASE_ID}`) : await findReleaseByTag(api,tag);
          if(!release||release.tag_name!==tag)throw new Error('The expected release draft was not found');
          if(releasePlan(tag,release.assets).hasBuilds)throw new Error('One or more native platform installers are missing');
          if(release.draft&&!/-(rc|beta|alpha)\./.test(tag)) {
            if(release.target_commitish!==process.env.RELEASE_COMMIT)throw new Error('Release source commit mismatch');
            await api(`/releases/${release.id}`,{draft:false,prerelease:false,make_latest:'true'});
            console.log(`Published stable Latest ${tag} with all Windows/Linux/macOS Intel/Apple Silicon installers`);
          } else console.log(`All platforms verified for ${tag}; existing release metadata preserved`);
          NODE
