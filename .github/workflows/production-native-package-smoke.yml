name: Production Linux and macOS package smoke test

on:
  push:
    branches: [release-preflight/v1.0.13]
    paths: [.github/workflows/production-native-package-smoke.yml]

permissions:
  contents: read

jobs:
  native-packages:
    name: Validate ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      VITE_API_URL: https://api.bestwayec.uz/v1
      VITE_WEB_URL: https://bestwayec.uz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7f97f9ed1a480f27fd2b83d32a4defeb26b936b7
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Prepare Ubuntu packaging and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf libfuse2 libgles2 xvfb xauth x11-utils dbus-x11
      - run: npm ci
      - name: Build validation packages from the exact main commit
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          test "$(git rev-parse HEAD)" = 7f97f9ed1a480f27fd2b83d32a4defeb26b936b7
          npm run tauri build -- --target "$TARGET" --bundles "$BUNDLES" --config src-tauri/tauri.manual-installer.conf.json

      - name: Verify AppImage helpers and run AppImage and installed DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          bundle="src-tauri/target/$TARGET/release/bundle"
          images=("$bundle"/appimage/*.AppImage)
          packages=("$bundle"/deb/*.deb)
          test "${#images[@]}" -eq 1
          test "${#packages[@]}" -eq 1
          image=$(realpath "${images[0]}")
          package=$(realpath "${packages[0]}")
          test "$(dpkg-deb --field "$package" Architecture)" = amd64
          dpkg-deb --field "$package" Depends | grep -F libwebkit2gtk-4.1-0
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          "$image" --appimage-extract >/dev/null
          test -x squashfs-root/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitNetworkProcess
          test -x squashfs-root/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitWebProcess
          cat > "$work/launch.sh" <<'BASH'
          set -euo pipefail
          "$1" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for ((attempt=0; attempt<30; attempt++)); do
            window=$(xwininfo -root -tree | awk '/"Bestway Exam"/ {print $1; exit}')
            if [[ -n "$window" ]] && xwininfo -id "$window" | grep -q 'Map State: IsViewable'; then
              echo 'Bestway Exam opened a visible window'
              exit 0
            fi
            kill -0 "$pid"
            sleep 1
          done
          exit 1
          BASH
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 40s xvfb-run -a dbus-run-session -- bash "$work/launch.sh" "$image"
          sudo apt-get install -y "$package"
          test "$(dpkg-query -W -f='${Version}' bestway-app)" = 1.0.12
          timeout 40s xvfb-run -a dbus-run-session -- bash "$work/launch.sh" /usr/bin/bestway-app

      - name: Mount DMG and verify the app architecture, microphone metadata and local signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          images=("src-tauri/target/$TARGET/release/bundle/dmg/"*.dmg)
          test "${#images[@]}" -eq 1
          work=$(mktemp -d)
          trap 'hdiutil detach "$work" -quiet || true; rmdir "$work"' EXIT
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$work" -quiet
          apps=("$work"/*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$plist" | grep -q '[^[:space:]]'
          binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          expected=x86_64
          if [[ "$TARGET" == aarch64-* ]]; then expected=arm64; fi
          test "$(lipo -archs "$app/Contents/MacOS/$binary")" = "$expected"
          codesign --verify --strict "$app"
          codesign -d --entitlements :- "$app" 2>/dev/null | \
            plutil -extract com.apple.security.device.audio-input raw -expect bool -o - -
          echo "Verified mounted DMG for $expected"
