name: Production macOS package smoke test

on:
  push:
    branches: [release-preflight/v1.0.13]
    paths: [.github/workflows/production-native-package-smoke.yml]

permissions:
  contents: read

jobs:
  native-packages:
    name: Validate ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      VITE_API_URL: https://api.bestwayec.uz/v1
      VITE_WEB_URL: https://bestwayec.uz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7f97f9ed1a480f27fd2b83d32a4defeb26b936b7
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Build validation packages from the exact main commit
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          test "$(git rev-parse HEAD)" = 7f97f9ed1a480f27fd2b83d32a4defeb26b936b7
          npm run tauri build -- --target "$TARGET" --bundles "$BUNDLES" --config src-tauri/tauri.manual-installer.conf.json

      - name: Mount DMG and verify the app architecture, microphone metadata and local signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          images=("src-tauri/target/$TARGET/release/bundle/dmg/"*.dmg)
          test "${#images[@]}" -eq 1
          work=$(mktemp -d)
          trap 'hdiutil detach "$work" -quiet || true; rmdir "$work"' EXIT
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$work" -quiet
          apps=("$work"/*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$plist" | grep -q '[^[:space:]]'
          binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          expected=x86_64
          if [[ "$TARGET" == aarch64-* ]]; then expected=arm64; fi
          test "$(lipo -archs "$app/Contents/MacOS/$binary")" = "$expected"
          codesign --verify --strict "$app"
          codesign -d --entitlements :- "$app" 2>/dev/null | \
            python3 -c 'import plistlib, sys; assert plistlib.loads(sys.stdin.buffer.read()).get("com.apple.security.device.audio-input") is True'
          echo "Verified mounted DMG for $expected"
