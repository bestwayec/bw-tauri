name: Release Android (bestway-app)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Target release tag (e.g. v0.7.0 or bestway-app-v0.7.0)
        required: true
        default: v0.7.0
        type: string
  push:
    tags:
      - "v*"
      - "bestway-app-v*"

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK 34
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build Android Release APK
        run: |
          cd android && gradle :app:assembleRelease --no-daemon

      - name: Align APK
        run: |
          zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk bestway-app-aligned.apk


      - name: Sign APK (official release keystore, v1+v2+v3)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            apksigner sign \
              --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --min-sdk-version 21 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out bestway-app.apk bestway-app-aligned.apk
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            keytool -genkeypair -v -keystore release.keystore -alias bestway \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass bestway2026 -keypass bestway2026 \
              -dname "CN=BestWay, OU=Exam, O=BestWay, L=Tashkent, C=UZ"

            apksigner sign \
              --ks release.keystore --ks-pass pass:bestway2026 --key-pass pass:bestway2026 \
              --min-sdk-version 21 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out bestway-app.apk bestway-app-aligned.apk
          fi

      - name: Verify Signed APK
        run: |
          apksigner verify --verbose --print-certs --min-sdk-version 21 bestway-app.apk | tee verify.txt
          grep -q "^Verifies" verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          SIZE=$(stat -c%s bestway-app.apk)
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 3145728 ]; then echo "FATAL: APK below 3 MB, rejected as stub" >&2; exit 1; fi
          sha256sum bestway-app.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bestway-app-apk
          path: bestway-app.apk

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "$TAG" bestway-app.apk --clobber || gh release create "$TAG" bestway-app.apk --title "BestWay App $TAG" --notes "Release BestWay Android $TAG" || true
          ALT_TAG=""
          if [[ "$TAG" == v* ]]; then
            ALT_TAG="bestway-app-$TAG"
          elif [[ "$TAG" == bestway-app-v* ]]; then
            ALT_TAG="${TAG#bestway-app-}"
          fi
          if [ -n "$ALT_TAG" ]; then
            gh release upload "$ALT_TAG" bestway-app.apk --clobber || gh release create "$ALT_TAG" bestway-app.apk --title "BestWay App $ALT_TAG" --notes "Release BestWay Android $ALT_TAG" || true
          fi
