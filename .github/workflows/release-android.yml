name: Release Android (bestway-app)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Target release tag (e.g. v0.5.4 or bestway-app-v0.5.4)
        required: true
        default: v0.5.4
        type: string
  push:
    tags:
      - "v*"
      - "bestway-app-v*"

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK 34
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build Android Release APK
        run: |
          cd android && gradle :app:assembleRelease --no-daemon

      - name: Align APK
        run: |
          zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk bestway-app-aligned.apk

      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias bestway \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bestway2026 -keypass bestway2026 \
            -dname "CN=BestWay, OU=Exam, O=BestWay, L=Tashkent, C=UZ"

          apksigner sign \
            --ks release.keystore --ks-pass pass:bestway2026 --key-pass pass:bestway2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out bestway-app.apk bestway-app-aligned.apk

      - name: Verify Signed APK
        run: |
          apksigner verify --verbose bestway-app.apk
          ls -lh bestway-app.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bestway-app-apk
          path: bestway-app.apk

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "$TAG" bestway-app.apk --clobber || gh release create "$TAG" bestway-app.apk --title "BestWay App $TAG" --notes "Release BestWay Android $TAG" || true
          if [ "$TAG" != "v0.5.4" ]; then
            gh release upload "v0.5.4" bestway-app.apk --clobber || gh release create "v0.5.4" bestway-app.apk --title "BestWay App v0.5.4" --notes "Release BestWay Android v0.5.4" || true
          fi
          if [ "$TAG" != "bestway-app-v0.5.4" ]; then
            gh release upload "bestway-app-v0.5.4" bestway-app.apk --clobber || gh release create "bestway-app-v0.5.4" bestway-app.apk --title "BestWay App v0.5.4" --notes "Release BestWay Android v0.5.4" || true
          fi
