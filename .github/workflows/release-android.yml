name: Release Android (bestway-app)

on:
  workflow_call:
    inputs:
      release_commit:
        required: true
        type: string
      release_tag:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK 34
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.6"

      - name: Build Android Release APK
        run: |
          cd android && gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon

      - name: Align APK
        run: |
          zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk bestway-app-aligned.apk


      - name: Sign APK (official release keystore, v1+v2+v3)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Production APKs are signed only with the official release keystore.
          # A throwaway key would publish an APK that cannot update earlier
          # installs, so a missing secret stops the release instead.
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. The APK is signed only with the official release keystore; refusing to sign with a temporary key."
            exit 1
          fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          apksigner sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out bestway-app.apk bestway-app-aligned.apk

      - name: Verify Signed APK and upgrade identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          apksigner verify --verbose --print-certs --min-sdk-version 24 bestway-app.apk | tee verify.txt
          grep -q "^Verifies" verify.txt
          # API 24 verifies v2 instead of v1 even when both signatures exist.
          apksigner verify --verbose --min-sdk-version 23 bestway-app.apk > "$RUNNER_TEMP/verify-v1.txt"
          grep -q "Verified using v1 scheme (JAR signing): true" "$RUNNER_TEMP/verify-v1.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          test "$(stat -c%s bestway-app.apk)" -ge 3145728
          curl --fail --silent --show-error --location \
            https://github.com/bestwayec/bw-tauri/releases/download/v1.0.10/bestway-app.apk \
            --output "$RUNNER_TEMP/previous.apk"
          printf '%s  %s\n' af60066c6e715d2a4211a64e86b6e3bab82c06a066d18df390852dc05d1c9c38 "$RUNNER_TEMP/previous.apk" | sha256sum --check
          apksigner verify --print-certs "$RUNNER_TEMP/previous.apk" > "$RUNNER_TEMP/previous-certs.txt"
          grep '^Signer #.* certificate SHA-256 digest:' verify.txt > "$RUNNER_TEMP/certs.txt"
          grep '^Signer #.* certificate SHA-256 digest:' "$RUNNER_TEMP/previous-certs.txt" > "$RUNNER_TEMP/baseline-certs.txt"
          diff "$RUNNER_TEMP/baseline-certs.txt" "$RUNNER_TEMP/certs.txt"
          aapt dump badging bestway-app.apk > "$RUNNER_TEMP/current-badging.txt"
          aapt dump badging "$RUNNER_TEMP/previous.apk" > "$RUNNER_TEMP/previous-badging.txt"
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path

          def package(filename):
              text = (Path(os.environ["RUNNER_TEMP"]) / filename).read_text()
              match = re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", text, re.M)
              if not match:
                  raise RuntimeError(f"Missing package metadata in {filename}")
              return match[1], int(match[2]), match[3], text

          identity, code, version, details = package("current-badging.txt")
          prior_identity, prior_code, _, _ = package("previous-badging.txt")
          tag_version = os.environ["RELEASE_TAG"].removeprefix("bestway-app-").removeprefix("v")
          if identity != prior_identity or identity != "uz.bestwayec.app" or code <= prior_code or version != tag_version:
              raise RuntimeError("Android package identity, version or upgrade version code mismatch")
          if "sdkVersion:'24'" not in details.splitlines():
              raise RuntimeError("Unexpected Android minimum SDK")
          PYTHON
          sha256sum bestway-app.apk > android-sha256.txt

      - name: Upload verified APK for the release coordinator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bestway-app-apk
          if-no-files-found: error
          path: |
            bestway-app.apk
            android-sha256.txt
