name: Release Android (bestway-app)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Target release tag (e.g. v0.7.0 or bestway-app-v0.7.0)
        required: true
        default: v0.7.0
        type: string
  push:
    tags:
      - "v*"
      - "bestway-app-v*"

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK 34
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build Android Release APK
        run: |
          cd android && gradle :app:assembleRelease --no-daemon

      - name: Align APK
        run: |
          zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk bestway-app-aligned.apk


      - name: Sign APK (official release keystore, v1+v2+v3)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Production APKs are signed only with the official release keystore.
          # A throwaway key would publish an APK that cannot update earlier
          # installs, so a missing secret stops the release instead.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Official Android keystore secrets are missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Refusing to sign with a temporary key."
            exit 1
          fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          apksigner sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out bestway-app.apk bestway-app-aligned.apk

      - name: Verify Signed APK
        run: |
          apksigner verify --verbose --print-certs --min-sdk-version 24 bestway-app.apk | tee verify.txt
          grep -q "^Verifies" verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          SIZE=$(stat -c%s bestway-app.apk)
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 3145728 ]; then echo "FATAL: APK below 3 MB, rejected as stub" >&2; exit 1; fi
          sha256sum bestway-app.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bestway-app-apk
          path: bestway-app.apk

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        # Never create a release here. A release created by this job used the
        # default branch as its commitish (so the desktop publish job refused
        # it with "Release source commit mismatch"), and the extra
        # `bestway-app-vX` release it created became GitHub's "Latest" with
        # only an APK, which made releases/latest/download/latest.json 404 for
        # every desktop updater. The desktop workflow owns the release; wait
        # for its draft and attach the APK to it.
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
              gh release upload "$TAG" bestway-app.apk --clobber
              echo "Attached APK to $TAG"
              exit 0
            fi
            echo "Waiting for the desktop release $TAG (attempt $attempt/60)..."
            sleep 60
          done
          echo "::error::Release $TAG was not created by the desktop workflow within 60 minutes; APK kept as a workflow artifact" >&2
          exit 1
