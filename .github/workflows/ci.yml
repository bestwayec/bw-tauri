# PR checks: TypeScript + Vite build on ubuntu, Rust check with Linux WebKit deps.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read # default-deny

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Desktop release planning tests
        run: node --test tools/release-platforms.test.mjs tools/updater-manifest.test.mjs tools/publish-updater-manifest.test.mjs

      - name: Android signing and security tests
        run: node --test tools/android-signing.test.mjs tools/android-security.test.mjs tools/android-oauth.test.mjs

      - name: Build
        run: npm run build

  rust:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libssl-dev libxdo-dev

      - name: Install deps + build frontend
        # tauri::generate_context!() panics when frontendDist (../dist) is
        # missing — dist/ is gitignored, so the rust job must build it first.
        run: |
          npm ci
          npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --message-format short

      - name: Cargo tests
        working-directory: src-tauri
        # Needs a full codegen build (heavy); on small machines prefer
        # `cargo check --tests`. CI runners handle it fine.
        run: cargo test

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Test and Assemble Android Release
        run: |
          cd android && gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon
      - name: Install and launch the Android app offline on an emulator
        timeout-minutes: 18
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$sdkmanager_bin"
          sdk_bin=$(dirname "$sdkmanager_bin")
          adb="$ANDROID_HOME/platform-tools/adb"
          image='system-images;android-34;google_apis;x86_64'

          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" --install emulator "$image"
          printf 'no\n' | "$sdk_bin/avdmanager" create avd --force --name bestway-pr --package "$image"

          echo "=== Verifying AVD configuration ==="
          "$sdk_bin/avdmanager" list avd
          if [ ! -f "$ANDROID_AVD_HOME/bestway-pr.ini" ]; then
            echo "bestway-pr.ini not in $ANDROID_AVD_HOME, checking for other locations..."
            found_ini=$(find "$HOME/.android" -name "bestway-pr.ini" 2>/dev/null | head -1)
            if [ -n "$found_ini" ]; then
              echo "Found at $found_ini, syncing to $ANDROID_AVD_HOME"
              cp "$found_ini" "$ANDROID_AVD_HOME/"
              found_dir=$(dirname "$found_ini")
              if [ -d "$found_dir/bestway-pr.avd" ] && [ ! -d "$ANDROID_AVD_HOME/bestway-pr.avd" ]; then
                cp -r "$found_dir/bestway-pr.avd" "$ANDROID_AVD_HOME/"
              fi
            fi
          fi

          if [ ! -f "$ANDROID_AVD_HOME/bestway-pr.ini" ]; then
            echo "ERROR: bestway-pr.ini could not be found in $ANDROID_AVD_HOME"
            find "$HOME" -maxdepth 4 -name "*bestway-pr*" || true
            exit 1
          fi

          echo "AVD configuration verified ($ANDROID_AVD_HOME/bestway-pr.ini):"
          cat "$ANDROID_AVD_HOME/bestway-pr.ini"

          emulator="$ANDROID_HOME/emulator/emulator"
          echo "=== Verifying discoverable AVDs via emulator ==="
          "$emulator" -list-avds
          "$emulator" -list-avds | grep -qx 'bestway-pr' || {
            echo "ERROR: emulator -list-avds did not discover bestway-pr"
            exit 1
          }

          gradle -p android :app:assembleDebug --no-daemon
          log="$RUNNER_TEMP/bestway-emulator.log"
          "$adb" start-server
          "$emulator" -accel-check
          "$emulator" -avd bestway-pr -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2 >"$log" 2>&1 &
          emulator_pid=$!
          trap 'result=$?; if [ "$result" -ne 0 ]; then tail -80 "$log"; { echo "### Emulator diagnostics"; echo "~~~text"; tail -40 "$log"; echo "~~~"; } >> "$GITHUB_STEP_SUMMARY"; fi; kill "$emulator_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            kill -0 "$emulator_pid" 2>/dev/null || { echo 'Emulator exited before boot'; tail -40 "$log"; exit 1; }
            [ "$(timeout 5 "$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 2
          done
          test "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1
          "$adb" shell svc wifi disable
          "$adb" shell svc data disable
          "$adb" install -g -t android/app/build/outputs/apk/debug/app-debug.apk
          "$adb" shell pm grant uz.bestwayec.app android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          "$adb" shell pm grant uz.bestwayec.app android.permission.RECORD_AUDIO 2>/dev/null || true
          "$adb" shell am start -W -n uz.bestwayec.app/.MainActivity | tee "$RUNNER_TEMP/bestway-android-start.log"
          grep -q 'Status: ok' "$RUNNER_TEMP/bestway-android-start.log"
          sleep 3
          "$adb" shell pidof uz.bestwayec.app
          "$adb" shell dumpsys activity activities > "$RUNNER_TEMP/bestway-android-activities.log"
          grep -E 'uz\.bestwayec\.app/\.MainActivity' "$RUNNER_TEMP/bestway-android-activities.log"
